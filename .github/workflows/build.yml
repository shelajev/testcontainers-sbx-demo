name: Build strategy
on:
  push:
    branches-ignore:
      - dependabot/**
    tags:
      - "**"
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '27'
          cache: maven
      # Publishing and ordinary builds must never provision a sandbox.
      - run: ./mvnw -B -ntp verify
      - name: Compile the standalone JitPack consumer
        run: ./mvnw -B -ntp -f examples/maven/pom.xml -DskipTests test
