name: Build strategy
on:
  push:
  pull_request:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '27'
          cache: maven
      # Publishing and ordinary builds must never provision a sandbox.
      - run: ./mvnw -B -ntp verify
      - name: Compile the standalone JitPack consumer
        run: ./mvnw -B -ntp -f examples/maven/pom.xml -DskipTests test
