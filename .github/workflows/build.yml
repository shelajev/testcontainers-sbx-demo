name: Build strategy
on:
  push:
  pull_request:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      # Publishing and ordinary builds must never provision a sandbox.
      - run: ./mvnw -B -ntp verify
      - name: Compile the standalone JitPack consumer
        run: ./mvnw -B -ntp -f examples/maven/pom.xml -DskipTests test
