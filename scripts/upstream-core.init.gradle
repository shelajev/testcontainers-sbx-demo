// Scope the upstream core suite to ordinary containers on an arm64 sandbox.
allprojects {
    plugins.withId('java') {
        tasks.withType(Test).configureEach {
            if (path == ':testcontainers:test') {
                exclude '**/Compose*Test.class'
                exclude '**/DockerCompose*Test.class'
                exclude '**/Reusability*Test.class'
                exclude '**/ExposedHostTest.class'
                exclude '**/DockerModelRunnerContainerTest.class'
                exclude '**/DockerMcpGatewayContainerTest.class'
                // These fixtures pin images that cannot run on this arm64 sandbox.
                exclude '**/DockerfileContainerTest.class'
                exclude '**/GenericContainerRuleTest.class'
                // This test installs nmap-ncat at container start with a 3s deadline.
                filter.excludeTestsMatching('org.testcontainers.junit.wait.strategy.HttpWaitStrategyTest.testWaitUntilReadyWithTlsAndAllowUnsecure')
            }
        }
    }
}
